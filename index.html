<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026數實祭 - 學習料理實驗室</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'scale-up': 'scaleUp 0.3s ease-out',
              'pulse-soft': 'pulseSoft 2s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              scaleUp: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              pulseSoft: {
                '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(249, 115, 22, 0.4)' },
                '50%': { transform: 'scale(1.02)', boxShadow: '0 0 20px 10px rgba(249, 115, 22, 0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      body { background-color: #f9fafb; font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
      .modal-backdrop { background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); }
      #root { min-height: 100vh; }
      .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          ChefHat, Flame, Utensils, Camera, ArrowRight, ArrowLeft, 
          Check, RefreshCw, Sparkles, Share2, Download, ExternalLink, User, Info, Tag, Rocket
        } from 'lucide-react';

        // --- 設定區 ---
        const MASTER_KEY = "SECRET_SAVED_IN_CLOUDFLARE"; 
        const apiKey = MASTER_KEY;
        const PADLET_URL = "https://padlet.com/tschool1/padlet-wzxj1k722jtzi3xn";

        // --- Helper: 圖片生成 ---
        // --- Helper: 圖片生成（已修正為呼叫 Cloudflare Worker 代理） ---
        const generateDishImage = async (dishData) => {
          // 1. 組裝要給 AI 的完整 Prompt
          const prompt = `Artistic professional food photography of a dish: "${dishData.dishName}". Concept: "${dishData.mainIngredient}". Style: "${dishData.platingStyle}". High-end cinematic lighting, gourmet presentation, hyper-realistic, 8k.`;
          
          // 2. 將網址替換為您剛才建立成功的 Cloudflare Worker 網址
          const workerUrl = "https://testimage.jack75926153882.workers.dev";
          
          try {
            // 3. 呼叫 Worker，前端「完全不用帶 API Key」
            const response = await fetch(workerUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                prompt: prompt // 配合 Worker 接收的格式
              }),
            });
            
            if (!response.ok) throw new Error('Worker Proxy Error');
            const result = await response.json();
            
            // 4. 解析 Worker 回傳的 Google Imagen 3 標準 Base64 格式
            if (result.generatedImages?.[0]?.image?.imageBytes) {
              const base64Bytes = result.generatedImages[0].image.imageBytes;
              return `data:image/jpeg;base64,${base64Bytes}`;
            }
          } catch (e) {
            console.error("圖片生成失敗，走備用圖片流程:", e);
          }
          // 萬一失敗，走預設 Unsplash 備用圖
          return "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800";
        };

        function LearningApp() {
          const [view, setView] = useState('landing');
          const [loading, setLoading] = useState(false);
          const [currentStep, setCurrentStep] = useState(0);
          
          const [formData, setFormData] = useState({
            chefName: '',
            dishName: '',
            mainIngredient: '',
            methods: [],
            spices: [],
            spiceReason: '',
            skillLevel: '初學',
            skillType: '',
            platingStyle: '',
            generatedImageUrl: null,
          });

          const handleInputChange = (field, value) => setFormData(p => ({ ...p, [field]: value }));
          
          const toggleSelection = (field, value, max = 1) => {
            setFormData(p => {
              const list = p[field];
              if (list.includes(value)) return { ...p, [field]: list.filter(i => i !== value) };
              if (list.length >= max) return p;
              return { ...p, [field]: [...list, value] };
            });
          };

          const startCooking = async () => {
            setLoading(true);
            try {
              const url = await generateDishImage(formData);
              setFormData(p => ({ ...p, generatedImageUrl: url }));
              setView('result');
            } finally {
              setLoading(false);
            }
          };

          // --- 核心功能：合成文字、下載並連動 Padlet ---
          const downloadAndGoToPadlet = () => {
            if (!formData.generatedImageUrl) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = formData.generatedImageUrl;

            img.onload = () => {
              canvas.width = 1200;
              canvas.height = 1200;
              ctx.drawImage(img, 0, 0, 1200, 1200);
              const gradient = ctx.createLinearGradient(0, 800, 0, 1200);
              gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
              gradient.addColorStop(1, 'rgba(0, 0, 0, 0.85)');
              ctx.fillStyle = gradient;
              ctx.fillRect(0, 800, 1200, 400);

              ctx.fillStyle = '#f97316'; 
              ctx.beginPath();
              ctx.roundRect(50, 50, 300, 70, 20);
              ctx.fill();
              ctx.fillStyle = 'white';
              ctx.font = 'bold 32px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`${formData.mainIngredient}`, 200, 95);
              ctx.textAlign = 'left';

              ctx.fillStyle = 'white';
              ctx.font = 'black 85px sans-serif';
              ctx.shadowColor = 'rgba(0,0,0,0.5)';
              ctx.shadowBlur = 15;
              ctx.fillText(formData.dishName || '無名學習料理', 60, 1040);
              ctx.shadowBlur = 0;

              ctx.font = 'bold 45px sans-serif';
              ctx.fillStyle = '#fdba74'; 
              ctx.fillText(`總舖師：${formData.chefName || '神秘客'}`, 60, 1115);

              const keywords = [...formData.methods, ...formData.spices, formData.platingStyle].filter(Boolean).join('  •  ');
              ctx.font = 'italic 26px sans-serif';
              ctx.fillStyle = 'rgba(255,255,255,0.75)';
              ctx.fillText(keywords, 60, 1165);

              ctx.font = 'bold 22px sans-serif';
              ctx.fillStyle = 'rgba(255,255,255,0.4)';
              ctx.textAlign = 'right';
              ctx.fillText('2026 數實祭：學習料理實驗室', 1140, 1165);

              const link = document.createElement('a');
              link.href = canvas.toDataURL('image/jpeg', 0.95);
              link.download = `數實祭-${formData.dishName || '成果'}-${formData.chefName || '主廚'}.jpg`;
              link.click();

              // 重要優化：下載後自動開啟 Padlet
              setTimeout(() => {
                window.open(PADLET_URL, '_blank');
              }, 1000);
            };
          };

          const steps = [
            { id: 'chef', title: '主廚', icon: <User size={20}/> },
            { id: 'origin', title: '產地', icon: <Utensils size={20}/> },
            { id: 'prep', title: '備料', icon: <ChefHat size={20}/> },
            { id: 'spice', title: '調味', icon: <Sparkles size={20}/> },
            { id: 'heat', title: '火候', icon: <Flame size={20}/> },
            { id: 'plate', title: '擺盤', icon: <Camera size={20}/> },
          ];

          return (
            <div className="min-h-screen flex flex-col items-center justify-start bg-gray-50">
              
              {loading && (
                <div className="fixed inset-0 bg-black/80 z-[200] flex flex-col items-center justify-center text-white backdrop-blur-sm text-center px-6">
                  <div className="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mb-6 shadow-lg"></div>
                  <h2 className="text-2xl font-black mb-2">總舖師料理中...</h2>
                  <p className="text-orange-200 opacity-70 animate-pulse">正在利用 AI 將您的學習歷程視覺化</p>
                </div>
              )}

              {/* Landing Page */}
              {view === 'landing' && (
                <div className="w-full max-w-xl flex flex-col items-center justify-center min-h-screen p-6 text-center">
                  <div className="bg-white p-10 md:p-14 rounded-[3.5rem] shadow-2xl w-full border-b-[12px] border-orange-500 relative overflow-hidden transition-all hover:border-orange-600">
                    <div className="w-20 h-20 bg-orange-500 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-xl rotate-6 animate-pulse">
                      <Utensils className="text-white w-10 h-10" />
                    </div>
                    <h1 className="text-3xl md:text-5xl font-black mb-2 tracking-tight text-gray-800">2026 數實祭</h1>
                    <p className="text-orange-600 font-black mb-10 tracking-[0.4em] uppercase text-xl md:text-2xl">總舖師上菜計畫</p>
                    <p className="text-gray-500 text-md md:text-lg mb-12 leading-relaxed font-medium text-center">
                      準備好將您的學習素材大火快炒了嗎？<br/>
                      煮出一道屬於您自己的數位學習佳餚。
                    </p>
                    <div className="space-y-4">
                      <button onClick={() => setView('cooking')} className="w-full py-5 bg-orange-500 hover:bg-orange-600 text-white rounded-[1.5rem] font-black text-xl shadow-xl transition active:scale-95">
                        開始我的辦桌大廚料理計畫
                      </button>
                      <button onClick={() => window.open(PADLET_URL, '_blank')} className="w-full py-5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-[1.5rem] font-bold text-lg transition flex items-center justify-center gap-2">
                        參觀數位辦桌成果展 <ExternalLink size={18}/>
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Cooking View */}
              {view === 'cooking' && (
                <div className="w-full max-w-2xl min-h-screen bg-white shadow-2xl flex flex-col">
                  <div className="bg-orange-500 p-6 text-white flex justify-between items-center shadow-lg sticky top-0 z-10">
                    <button onClick={() => setView('landing')} className="p-2 hover:bg-white/20 rounded-full transition"><ArrowLeft size={24}/></button>
                    <span className="font-black text-lg tracking-widest uppercase">步驟 {currentStep + 1} / 6</span>
                    <div className="w-10"></div>
                  </div>
                  
                  <div className="flex-1 p-8 md:p-12 overflow-y-auto no-scrollbar">
                    <div className="flex gap-2 mb-10 overflow-x-auto no-scrollbar pb-3 border-b border-gray-50">
                      {steps.map((s, i) => (
                        <button 
                          key={s.id} 
                          onClick={() => setCurrentStep(i)}
                          className={`flex items-center gap-2 px-4 py-2 rounded-full whitespace-nowrap border-2 transition-all ${i === currentStep ? 'bg-orange-500 text-white border-orange-500 shadow-md scale-105' : 'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-100'}`}
                        >
                          {s.icon} <span className="text-[10px] font-black uppercase tracking-widest">{s.title}</span>
                        </button>
                      ))}
                    </div>

                    <div className="animate-fade-in">
                      {currentStep === 0 && (
                        <div className="space-y-6">
                          <h2 className="text-2xl font-black text-gray-800 underline decoration-orange-300 underline-offset-4 decoration-4">主廚報到與命名</h2>
                          <div className="space-y-6">
                            <div>
                              <label className="block text-xs font-black text-gray-400 mb-2 uppercase tracking-widest">您的總舖師大名</label>
                              <input type="text" placeholder="您的姓名或暱稱"
                                className="w-full p-4 border-2 border-orange-100 rounded-2xl focus:border-orange-500 bg-orange-50/20 outline-none font-bold shadow-sm"
                                value={formData.chefName} onChange={e => handleInputChange('chefName', e.target.value)} />
                            </div>
                            <div>
                              <label className="block text-xs font-black text-gray-400 mb-2 uppercase tracking-widest">這道學習料理的名字</label>
                              <input type="text" placeholder="例如：跨領域邏輯佐數據醬汁"
                                className="w-full p-4 border-2 border-orange-100 rounded-2xl focus:border-orange-500 bg-orange-50/20 outline-none font-bold shadow-sm"
                                value={formData.dishName} onChange={e => handleInputChange('dishName', e.target.value)} />
                            </div>
                          </div>
                        </div>
                      )}
                      {currentStep === 1 && (
                        <div className="space-y-6">
                          <h2 className="text-2xl font-black text-gray-800 underline decoration-orange-300 underline-offset-4 decoration-4">產地嚴選：選擇主食</h2>
                          <div className="grid grid-cols-2 gap-3">
                            {["人文社會", "自然科學", "藝術設計", "程式資訊", "心理探索", "商業管理", "語言文化", "法律政治", "機械工程", "建築景觀"].map(item => (
                              <button key={item} onClick={() => handleInputChange('mainIngredient', item)}
                                className={`p-5 rounded-xl border-2 text-left transition-all ${formData.mainIngredient === item ? 'border-orange-500 bg-orange-50 text-orange-700 font-black shadow-inner' : 'border-gray-100 bg-white hover:border-orange-200'}`}>
                                {item}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                      {currentStep === 2 && (
                        <div className="space-y-6">
                          <h2 className="text-2xl font-black text-gray-800 underline decoration-orange-300 underline-offset-4 decoration-4">備料區：料理方法</h2>
                          <p className="text-gray-400 text-sm">您如何進行實作？（最多選 2 項）</p>
                          <div className="grid grid-cols-2 gap-3">
                            {["獨立研究", "小組合作", "AI 協作", "田野調查", "文獻分析", "實作實驗"].map(item => (
                              <button key={item} onClick={() => toggleSelection('methods', item, 2)}
                                className={`p-5 rounded-xl border-2 text-left flex justify-between items-center transition-all font-black ${formData.methods.includes(item) ? 'border-blue-500 bg-blue-50 text-blue-700 shadow-inner' : 'border-gray-100 bg-white hover:border-blue-200'}`}>
                                {item} {formData.methods.includes(item) && <Check size={18} />}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                      {currentStep === 3 && (
                        <div className="space-y-6">
                          <h2 className="text-2xl font-black text-gray-800 underline decoration-orange-300 underline-offset-4 decoration-4">獨家秘方：關懷議題</h2>
                          <div className="flex flex-wrap gap-2">
                            {["SDGs 永續", "在地文化", "科技倫理", "社會正義", "心理健康", "創新創業"].map(item => (
                              <button key={item} onClick={() => toggleSelection('spices', item, 3)}
                                className={`px-4 py-2 rounded-full border-2 transition-all font-black text-xs ${formData.spices.includes(item) ? 'bg-red-500 text-white border-red-500 shadow-md scale-105' : 'bg-white border-gray-100 text-gray-400 hover:border-red-200'}`}>
                                {item}
                              </button>
                            ))}
                          </div>
                          <textarea placeholder="這道料理的靈魂在於...？（分享學習過程中的心得體悟）" 
                            className="w-full p-5 border-2 border-gray-100 rounded-3xl h-32 focus:border-red-500 outline-none bg-red-50/10 font-medium transition-all"
                            value={formData.spiceReason} onChange={e => handleInputChange('spiceReason', e.target.value)} />
                        </div>
                      )}
                      {currentStep === 4 && (
                        <div className="space-y-6">
                          <h2 className="text-2xl font-black text-gray-800 underline decoration-orange-300 underline-offset-4 decoration-4">火候掌控：核心技能</h2>
                          <select className="w-full p-4 border-2 border-gray-100 rounded-xl outline-none focus:border-yellow-500 font-bold bg-white shadow-sm"
                            value={formData.skillType} onChange={e => handleInputChange('skillType', e.target.value)}>
                            <option value="">選擇您的核心技能...</option>
                            {["影片剪輯", "程式設計", "口語表達", "數據分析", "平面設計", "專案管理", "表演藝術", "模型建置"].map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                          {formData.skillType && (
                            <div className="flex gap-2">
                              {["初學", "熟練", "專精"].map(lvl => (
                                <button key={lvl} onClick={() => handleInputChange('skillLevel', lvl)}
                                  className={`flex-1 py-4 rounded-xl border-2 font-black transition-all ${formData.skillLevel === lvl ? 'bg-yellow-500 text-white border-yellow-500 shadow-md scale-105' : 'bg-white border-gray-100 text-gray-400 hover:border-yellow-200'}`}>
                                  {lvl}
                                </button>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                      {currentStep === 5 && (
                        <div className="space-y-6">
                          <h2 className="text-2xl font-black text-gray-800 underline decoration-orange-300 underline-offset-4 decoration-4">擺盤風格：成果呈現</h2>
                          <div className="grid grid-cols-1 gap-3">
                            {["專業簡報型", "社群創作型", "學術研究型", "市集商品型", "策展運用型", "藝文展演型"].map(s => (
                              <button key={s} onClick={() => handleInputChange('platingStyle', s)}
                                className={`p-5 rounded-3xl border-2 text-left transition-all ${formData.platingStyle === s ? 'border-purple-500 bg-purple-50 font-black ring-2 ring-purple-100 shadow-md' : 'border-gray-100 bg-white hover:border-purple-200'}`}>
                                {s}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="p-8 border-t bg-gray-50 flex justify-between gap-4 sticky bottom-0 glass-effect">
                    <button onClick={() => setCurrentStep(s => Math.max(0, s - 1))} className={`px-6 py-4 rounded-2xl font-black text-gray-400 ${currentStep === 0 ? 'invisible' : 'hover:bg-gray-200 transition'}`}>上一步</button>
                    {currentStep < 5 ? (
                      <button onClick={() => setCurrentStep(s => s + 1)} 
                        disabled={currentStep === 0 && (!formData.chefName || !formData.dishName)}
                        className="flex-1 py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-black flex items-center justify-center gap-2 shadow-xl disabled:opacity-40 transition-all active:scale-95 text-xl">
                        下一步 <ArrowRight size={24} />
                      </button>
                    ) : (
                      <button onClick={startCooking} disabled={!formData.platingStyle}
                        className="flex-1 py-4 bg-green-600 hover:bg-green-700 text-white rounded-2xl font-black flex items-center justify-center gap-2 shadow-xl animate-pulse disabled:animate-none disabled:opacity-40 transition-all text-xl">
                        <Sparkles size={24} /> 完成創作並拍照
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* Result Preview View */}
              {view === 'result' && (
                <div className="min-h-screen bg-gray-950 flex items-center justify-center p-6 w-full">
                  <div className="bg-white rounded-[2.5rem] overflow-hidden shadow-2xl max-w-md w-full animate-scale-up border-[6px] border-white relative overflow-y-auto no-scrollbar max-h-[90vh]">
                    <img src={formData.generatedImageUrl} className="w-full h-64 object-cover" />
                    <div className="p-10">
                      <div className="text-orange-600 font-black text-[10px] tracking-widest uppercase mb-2">{formData.mainIngredient} 作品</div>
                      <h1 className="text-2xl font-black mb-6 text-gray-800 leading-tight tracking-tight">{formData.dishName}</h1>
                      
                      <div className="flex flex-wrap gap-2 mb-6">
                        {formData.methods.map(m => <span key={m} className="px-2 py-1 bg-blue-50 text-blue-600 text-[10px] font-black rounded border border-blue-100">{m}</span>)}
                        {formData.spices.map(s => <span key={s} className="px-2 py-1 bg-red-50 text-red-600 text-[10px] font-black rounded border border-red-100">{s}</span>)}
                        <span className="px-2 py-1 bg-purple-50 text-purple-600 text-[10px] font-black rounded border border-purple-100">{formData.platingStyle}</span>
                      </div>

                      <div className="bg-orange-50/50 p-6 rounded-3xl mb-8 border border-orange-100 text-xs italic text-gray-500 font-medium h-24 overflow-y-auto no-scrollbar shadow-inner leading-relaxed">
                        <Info size={14} className="inline mr-1 mb-1 text-orange-400" />
                        "{formData.spiceReason}"
                      </div>
                      <div className="flex justify-between items-center text-[10px] text-gray-400 border-t pt-6 font-bold uppercase tracking-widest">
                        <div className="flex items-center gap-2 font-black">
                            <User size={14} className="text-orange-400"/> <span>主廚：{formData.chefName || '匿名'}</span>
                        </div>
                        <div className="font-bold tracking-wider">技能：{formData.skillType}</div>
                      </div>
                    </div>
                    
                    <div className="px-8 pb-8 flex flex-col gap-3 sticky bottom-0 bg-white pt-2 shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
                      <p className="text-center text-[10px] text-orange-600 font-bold animate-bounce flex items-center justify-center gap-1">
                        <Rocket size={12}/> 下載後請點選 Padlet 右下角「+」號上傳成果
                      </p>
                      <button onClick={downloadAndGoToPadlet} className="w-full py-5 bg-orange-500 text-white font-black rounded-2xl shadow-xl hover:bg-orange-600 transition flex items-center justify-center gap-3 px-6 active:scale-95 animate-pulse-soft text-xl">
                        <Download size={24} /> 下載並前往上傳料理 (Padlet)
                      </button>
                      <div className="flex gap-3">
                        <button onClick={() => setView('cooking')} className="flex-1 py-4 font-black text-gray-400 hover:bg-gray-100 rounded-2xl transition border border-gray-100 text-sm">重新調配</button>
                        <button onClick={() => window.open(PADLET_URL, '_blank')} className="flex-1 py-4 bg-gray-100 text-gray-700 font-black rounded-2xl transition text-sm flex items-center justify-center gap-2">
                          直接開啟辦桌牆 <ExternalLink size={14}/>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<LearningApp />);
    </script>
</body>
